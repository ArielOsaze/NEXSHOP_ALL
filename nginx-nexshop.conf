# /etc/nginx/sites-available/nexshop.conf

server {
    listen 80;
    server_name nexshop.cloud www.nexshop.cloud;

    # Redirect all HTTP to canonical HTTPS
    return 301 https://nexshop.cloud$request_uri;
}

server {
    listen 443 ssl;
    server_name www.nexshop.cloud;

    # SSL configuration managed by certbot.
    ssl_certificate /etc/letsencrypt/live/nexshop.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexshop.cloud/privkey.pem;

    # Redirect WWW to Non-WWW on HTTPS
    return 301 https://nexshop.cloud$request_uri;
}

server {
    listen 443 ssl;
    server_name nexshop.cloud;

    # SSL configuration managed by certbot.
    ssl_certificate /etc/letsencrypt/live/nexshop.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexshop.cloud/privkey.pem;

    # Nginx defaultnya cuma terima body request maks 1MB — banner promo/foto
    # gampang lebih dari itu, jadi upload gagal (413 Request Entity Too Large)
    # SEBELUM sempat sampai ke backend Node.js. Audio admin menerima 30MB.
    client_max_body_size 32M;
    server_tokens off;

    # Kompres resource teks di edge server. Gambar tetap memakai file asli—
    # tidak ada penurunan resolusi atau perubahan asset visual.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Frontend (toko) di root
    root /var/www/NEXSHOP_ALL/nexshop-frontend;
    index index.html;

    # File HTML tetap selalu dicek ulang. Asset memakai URL berversi, sehingga
    # boleh disimpan lama tanpa membuat deploy JS/CSS lama tertinggal di browser.
    location ~* \.(?:css|js|mjs|woff2?|svg|webp|png|jpe?g|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Domain kanonik sudah HTTPS; paksa browser tetap memakai HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Inline <script> hanya diizinkan lewat hash konten yang diaudit. Handler
    # onclick legacy dipisahkan ke script-src-attr agar tidak membuka izin
    # inline untuk elemen script. Perbarui hash jika isi inline script berubah.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'sha256-4rEBRVoOEO7dt5W9y4Qz95wOiYIQfnzqDcLhHd28ofA=' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://challenges.cloudflare.com 'sha256-12AL0QkQRDhbw6fQQcyBHkO16C4LqRqwrO6cW6sQ6ZQ=' 'sha256-PUkqPLKK61yk3cGGv5mYfp9RhcSqUmTvBUQurAccVWo=' 'sha256-aJGfidgkueqi8f4zcxioS28NiTovX06t9ldpXoqcxrQ=' 'sha256-eEmIzeysXc1JaHWuZIriHOQXoqfKxM3tObmWPUvtqj0=' 'sha256-eIdt4TCXOrhQRLC7Aq1NooLGQcmivB8uwWBSZDOAB2o=' 'sha256-pw8xSY1xVTMeI2RwDQdmLltJLY4FjCJgjgXAuhRzP7A=' 'sha256-8NYZ43T0SMZgr+R/h8Lai4tXw53ASSGIQZuX44sVvg0=' 'sha256-prokvhyCWOPtr92lgBwEgbL/klfxPWUbTwAnR5fcEGw=' 'sha256-gi5jHjzJhf/XDigS/+7jfvOY3EKGeuHXgjb10k0JkVw=' 'sha256-L7dav+oAviqlShe6BlNFBdZOuq41x1VfYo4+96+YWes=' 'sha256-8fhnKYQR8WAHwLm8TdOvJGr+gydiMFhSps+nFrGNJ28=' 'sha256-9aRe8xAQFge9VA5HyOSy/KIBvrSwuSlXpLJwVZTrIhM=' 'sha256-oF+MnkB4WF8cGh9DoaZwjoQ20PNvFDjmGc9aVDJMK54=' 'sha256-rsdw6XKKUD/Bo9cjVBo8WbEs2SbG8MycKeQHE+n6H/A=' 'sha256-ZREV+icXiim89pxSvY9B3d16AmVfjZ7oQnLK2bKYBgo='; script-src-attr 'none'; style-src-elem 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'sha256-+ohrgojTWkWnLAMNgjOUv3NBbSnWteMHz7p7Rcs3B8Y=' 'sha256-8VxfF6mElWLMAwd9Fh9nEu6TVR2Mey0zHXHZoCeNPgw=' 'sha256-Te+FE3evNQExax7d6ZMTfWfFb+e3tRaeJBOgcN2tm2c=' 'sha256-VU1Hv4qp9I8XGTx2lGsX5YnPgLE6Ef1d/uzK4nDp4Ms=' 'sha256-Zs7xtaYi7LVdC8nJKiihkCNsCzRKt1raTB8uVMIXq98=' 'sha256-c4qsorCsf03WaF12qLX1x2vmChSyA7ZAN+bmAcb/xI8=' 'sha256-gZvn1dp1jprwxNuVEORXAX3KNaQnkykF/MBuCsUY0D4=' 'sha256-AZodh489W4C9yraGslnurmXMaJwWL7hp5jhPxuE393s=' 'sha256-/jt7GdoUZmiTqfDJT83OZ/NycpPwx3JP3VNQsWNoPSM=' 'sha256-UDqEyBil8JRugbh6SSM01LUZ7GGKCwAaMXy9aJf4ySc=' 'sha256-mu3YJoEyq7cPYDmXE6MyfXBhac/VL0hCGxNJMR+SjdQ='; style-src-attr 'none'; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: https://api.qrserver.com https://img.icons8.com https://cdn.aplikasikreasi.id https://cauklmkpjwsdwqoazqlx.supabase.co https://www.transparenttextures.com https://i0.wp.com https://api.duniagames.co.id https://static.promediateknologi.id https://asset.kompas.com https://awsimages.detik.net.id https://lh3.googleusercontent.com https://lh4.googleusercontent.com https://lh5.googleusercontent.com https://lh6.googleusercontent.com https://i.pinimg.com https://img3.tapimg.net; media-src 'self' https://cauklmkpjwsdwqoazqlx.supabase.co; connect-src 'self' https://nexshop.cloud https://challenges.cloudflare.com https://cauklmkpjwsdwqoazqlx.supabase.co; frame-src https://challenges.cloudflare.com; form-action 'self' https://my.ipaymu.com https://sandbox.ipaymu.com; upgrade-insecure-requests" always;
    # Sitemap API proxy
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000/api/sitemap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Homepage harus disajikan langsung dari file, bukan memilih direktori root.
    # Jika direktori dipilih, Nginx masuk ke `/index.html` dan rule canonical
    # di bawah mengarahkannya kembali ke `/` tanpa henti.
    location = / { expires -1; try_files /index.html =404; }

    # URL publik kanonik tanpa ekstensi. Link lama tetap kompatibel tetapi
    # selalu diarahkan ke URL bersih agar .html tidak muncul di address bar.
    location = /index.html { return 301 /; }
    location = /berita.html { return 301 /berita$is_args$args; }
    location = /berita-artikel.html { return 301 /berita/$arg_slug; }
    location = /marketplace.html { return 301 /marketplace$is_args$args; }
    location = /reseller.html { return 301 /reseller$is_args$args; }
    location = /portal-reseller.html { return 301 /portal-reseller$is_args$args; }
    location = /docs-reseller.html { return 301 /docs-reseller$is_args$args; }
    location = /login.html { return 301 /login$is_args$args; }
    location = /legalitas.html { return 301 /legalitas; }

    # News Portal Homepage
    location = /berita {
        expires -1;
        rewrite ^ /berita.html break;
    }

    location = /berita/ {
        expires -1;
        return 301 /berita;
    }

    # Deep-link top-up operator: satu template index dinamis membaca slug dari pathname.
    location ~ ^/topup/([a-z0-9]+(?:-[a-z0-9]+)*)$ {
        expires -1;
        try_files /index.html =404;
    }

    # Deep-link Marketplace operator: satu template marketplace dinamis membaca slug.
    location ~ ^/marketplace/([a-z0-9]+(?:-[a-z0-9]+)*)$ {
        expires -1;
        try_files /marketplace.html =404;
    }

    # Marketplace (One Stop Solution) -- halaman TERPISAH beneran, bukan
    # lagi rewrite ke index.html. /one-stop lama dipertahanin sebagai
    # redirect biar link/bookmark lama gak 404.
    location = /marketplace {
        expires -1;
        rewrite ^ /marketplace.html break;
    }

    location = /marketplace/ {
        expires -1;
        return 301 /marketplace;
    }

    # Halaman program reseller
    location = /reseller {
        expires -1;
        rewrite ^ /reseller.html break;
    }

    location = /reseller/ {
        expires -1;
        return 301 /reseller;
    }

    # Halaman dokumentasi & tutorial reseller
    location = /docs-reseller {
        expires -1;
        rewrite ^ /docs-reseller.html break;
    }

    location = /docs-reseller/ {
        expires -1;
        return 301 /docs-reseller;
    }

    # Partner Portal Reseller (API Keys, IP Whitelist, Webhook, Katalog Modal)
    location = /portal-reseller {
        expires -1;
        rewrite ^ /portal-reseller.html break;
    }

    location = /portal-reseller/ { return 301 /portal-reseller; }

    # Login customer dan modal legalitas di homepage.
    location = /login { expires -1; rewrite ^ /login.html break; }
    location = /login/ { return 301 /login; }
    location = /legalitas { expires -1; rewrite ^ /index.html break; }
    location = /legalitas/ { return 301 /legalitas; }

    location = /one-stop {
        return 301 /marketplace;
    }

    location = /one-stop/ {
        return 301 /marketplace;
    }

    # Clean URL untuk artikel berita (SSR)
    location ~ ^/berita/([^/]+)$ {
        proxy_pass http://127.0.0.1:3000/berita/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API -> Node.js/PM2 di port 3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin juga memakai URL bersih; URL lama tetap diarahkan permanen.
    location = /admin/login.html { return 301 /admin/login$is_args$args; }
    location = /admin/dashboard.html { return 301 /admin/dashboard$is_args$args; }
    location = /admin/login { expires -1; try_files /admin/login.html =404; }
    location = /admin/dashboard { expires -1; try_files /admin/dashboard.html =404; }

    # Aset dan file admin lainnya.
    location /admin/ {
        alias /var/www/NEXSHOP_ALL/nexshop-frontend/admin/;
        try_files $uri $uri/ =404;
    }

    # Frontend toko (bukan SPA, jadi cukup coba file aslinya lebih dulu)
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}

# Setelah domain diarahkan & DNS propagasi, jalankan:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d nexshop.cloud -d www.nexshop.cloud
# certbot otomatis nambahin block listen 443 ssl + redirect 80->443
