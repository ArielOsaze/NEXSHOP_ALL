# /etc/nginx/sites-available/nexshop.conf

server {
    listen 80;
    server_name nexshop.cloud www.nexshop.cloud;

    # Redirect all HTTP to canonical HTTPS
    return 301 https://nexshop.cloud$request_uri;
}

server {
    listen 443 ssl;
    server_name www.nexshop.cloud;

    # SSL configuration will be managed by certbot
    # ssl_certificate ...
    # ssl_certificate_key ...

    # Redirect WWW to Non-WWW on HTTPS
    return 301 https://nexshop.cloud$request_uri;
}

server {
    listen 443 ssl;
    server_name nexshop.cloud;

    # SSL configuration will be managed by certbot
    # ssl_certificate ...
    # ssl_certificate_key ...

    # Nginx defaultnya cuma terima body request maks 1MB — banner promo/foto
    # gampang lebih dari itu, jadi upload gagal (413 Request Entity Too Large)
    # SEBELUM sempat sampai ke backend Node.js sama sekali. Naikkin ke 20MB.
    client_max_body_size 20M;

    # Frontend (toko) di root
    root /var/www/nexshop/frontend;
    index index.html;

    # Header keamanan utama untuk storefront. (Removed strict HSTS per request until confirmed stable, uncomment if needed)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self' https://nexshop.cloud; form-action 'self' https://my.ipaymu.com https://sandbox.ipaymu.com" always;

    # Sitemap API proxy
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000/api/sitemap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # News Portal Homepage
    location = /berita {
        rewrite ^ /berita.html last;
    }
    
    location = /berita/ {
        rewrite ^ /berita.html last;
    }

    # Clean URL untuk artikel berita
    location ~ ^/berita/([^/]+)$ {
        rewrite ^/berita/([^/]+)$ /berita-artikel.html last;
    }

    # Backend API -> Node.js/PM2 di port 3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Halaman admin, misal nexshop.cloud/admin/login.html
    location /admin/ {
        alias /var/www/nexshop/frontend/admin/;
        try_files $uri $uri/ =404;
    }

    # Frontend toko (bukan SPA, jadi cukup coba file aslinya lebih dulu)
    location / {
        try_files $uri $uri/ =404;
    }
}

# Setelah domain diarahkan & DNS propagasi, jalankan:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d nexshop.cloud -d www.nexshop.cloud
# certbot otomatis nambahin block listen 443 ssl + redirect 80->443
