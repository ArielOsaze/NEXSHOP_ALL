# /etc/nginx/sites-available/nexshop.conf

server {
    listen 80;
    server_name nexshop.cloud www.nexshop.cloud;

    # Redirect all HTTP to canonical HTTPS
    return 301 https://nexshop.cloud$request_uri;
}

server {
    listen 443 ssl;
    server_name www.nexshop.cloud;

    # SSL configuration will be managed by certbot
    # ssl_certificate ...
    # ssl_certificate_key ...

    # Redirect WWW to Non-WWW on HTTPS
    return 301 https://nexshop.cloud$request_uri;
}

server {
    listen 443 ssl;
    server_name nexshop.cloud;

    # SSL configuration will be managed by certbot
    # ssl_certificate ...
    # ssl_certificate_key ...

    # Nginx defaultnya cuma terima body request maks 1MB — banner promo/foto
    # gampang lebih dari itu, jadi upload gagal (413 Request Entity Too Large)
    # SEBELUM sempat sampai ke backend Node.js. Audio admin menerima 30MB.
    client_max_body_size 32M;

    # Frontend (toko) di root
    root /var/www/nexshop/frontend;
    index index.html;

    # Domain kanonik sudah HTTPS; paksa browser tetap memakai HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Inline <script> hanya diizinkan lewat hash konten yang diaudit. Handler
    # onclick legacy dipisahkan ke script-src-attr agar tidak membuka izin
    # inline untuk elemen script. Perbarui hash jika isi inline script berubah.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com 'sha256-RBNvo1WzZ4oRRq0W9+hknpT7T8If536DEMBg9hyq/4o=' 'sha256-eEmIzeysXc1JaHWuZIriHOQXoqfKxM3tObmWPUvtqj0=' 'sha256-NB1g+/EjcNJn8Otwjzl5MlzKiZpMqJSEXd2H0UPnomY=' 'sha256-pw8xSY1xVTMeI2RwDQdmLltJLY4FjCJgjgXAuhRzP7A=' 'sha256-0dshY9M/5TN4SCRX65A+k3l5kuIL025hhfT67yz3SrU=' 'sha256-caG2zkY7jPKVDzmGQLyaUxYg4bPQMB4WSrqyJYCUQpI=' 'sha256-J3gtZxyNR8EiGUN9IGQ3VN98tyYmBOK7ok12nnaXxRQ=' 'sha256-ev/SXom+7xJFVWHhYjcsfUQ6d36W30+4/8k7j+p2md4=' 'sha256-gJB07JBRncZFzAZMuNSIFCEWCfB1gbxURmv1Zlb8uJc=' 'sha256-/exPm2nxD5Mn7CldwIaF/Gnh9fPhMpTwphHHeYYULEw=' 'sha256-EpfTdnAok2CIT8QIl587kYq3IhM6JtZDvTQbkyplM+Q=' 'sha256-2w+Pp6nZJ2647PXz54ptwKzinbeDVBxGKquOTLOLnnU='; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net data:; img-src 'self' data: https:; connect-src 'self' https://nexshop.cloud; form-action 'self' https://my.ipaymu.com https://sandbox.ipaymu.com; upgrade-insecure-requests" always;

    # Sitemap API proxy
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000/api/sitemap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # URL publik kanonik tanpa ekstensi. Link lama tetap kompatibel tetapi
    # selalu diarahkan ke URL bersih agar .html tidak muncul di address bar.
    location = /index.html { return 301 /; }
    location = /berita.html { return 301 /berita$is_args$args; }
    location = /berita-artikel.html { return 301 /berita/$arg_slug; }
    location = /marketplace.html { return 301 /marketplace$is_args$args; }
    location = /reseller.html { return 301 /reseller$is_args$args; }
    location = /portal-reseller.html { return 301 /portal-reseller$is_args$args; }
    location = /docs-reseller.html { return 301 /docs-reseller$is_args$args; }
    location = /login.html { return 301 /login$is_args$args; }
    location = /legalitas.html { return 301 /legalitas; }

    # News Portal Homepage
    location = /berita {
        rewrite ^ /berita.html break;
    }

    location = /berita/ {
        return 301 /berita;
    }

    # Marketplace (One Stop Solution) -- halaman TERPISAH beneran, bukan
    # lagi rewrite ke index.html. /one-stop lama dipertahanin sebagai
    # redirect biar link/bookmark lama gak 404.
    location = /marketplace {
        rewrite ^ /marketplace.html break;
    }

    location = /marketplace/ {
        return 301 /marketplace;
    }

    # Halaman program reseller
    location = /reseller {
        rewrite ^ /reseller.html break;
    }

    location = /reseller/ {
        return 301 /reseller;
    }

    # Halaman dokumentasi & tutorial reseller
    location = /docs-reseller {
        rewrite ^ /docs-reseller.html break;
    }

    location = /docs-reseller/ {
        return 301 /docs-reseller;
    }

    # Partner Portal Reseller (API Keys, IP Whitelist, Webhook, Katalog Modal)
    location = /portal-reseller {
        rewrite ^ /portal-reseller.html break;
    }

    location = /portal-reseller/ { return 301 /portal-reseller; }

    # Login customer dan modal legalitas di homepage.
    location = /login { rewrite ^ /login.html break; }
    location = /login/ { return 301 /login; }
    location = /legalitas { rewrite ^ /index.html break; }
    location = /legalitas/ { return 301 /legalitas; }

    location = /one-stop {
        return 301 /marketplace;
    }

    location = /one-stop/ {
        return 301 /marketplace;
    }

    # Clean URL untuk artikel berita (SSR)
    location ~ ^/berita/([^/]+)$ {
        proxy_pass http://127.0.0.1:3000/berita/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API -> Node.js/PM2 di port 3000
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Admin juga memakai URL bersih; URL lama tetap diarahkan permanen.
    location = /admin/login.html { return 301 /admin/login$is_args$args; }
    location = /admin/dashboard.html { return 301 /admin/dashboard$is_args$args; }
    location = /admin/login { rewrite ^ /admin/login.html break; }
    location = /admin/dashboard { rewrite ^ /admin/dashboard.html break; }

    # Aset dan file admin lainnya.
    location /admin/ {
        alias /var/www/nexshop/frontend/admin/;
        try_files $uri $uri/ =404;
    }

    # Frontend toko (bukan SPA, jadi cukup coba file aslinya lebih dulu)
    location / {
        try_files $uri $uri/ =404;
    }
}

# Setelah domain diarahkan & DNS propagasi, jalankan:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d nexshop.cloud -d www.nexshop.cloud
# certbot otomatis nambahin block listen 443 ssl + redirect 80->443
