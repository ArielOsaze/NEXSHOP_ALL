<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin - NexShop</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
<link rel="stylesheet" href="/fonts/google-fonts.css">
<link rel="stylesheet" href="css/style.css?v=20260824-admin-brand">
<script src="../theme-init.js"></script>
<script defer src="/clean-url.js?v=20260828-admin-loop-1"></script>
<link rel="stylesheet" href="/inline-styles.css?v=aa0fee6">
<script defer src="/csp-legacy-handlers.js?v=aa0fee6"></script>
</head>
<body class="login-page">

<div class="login-card">
    <div class="login-logo">
        <img src="../images/nexshop-logo.webp" alt="Logo NexShop" width="56" height="56">
    </div>
    <h2>NexShop Admin</h2>
    <p class="text-muted mb-4">Masuk untuk mengelola toko kamu</p>

    <form id="loginForm" novalidate>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="admin@nexshop.com" required autocomplete="username">
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
                <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
                <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <div class="admin-turnstile" id="adminLoginTurnstile" hidden></div>
        <p class="text-danger small mb-3 hidden" id="adminLoginTurnstileStatus" role="alert" aria-live="polite"></p>

        <p class="text-danger small mb-3" id="loginError"></p>

        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
    </form>
</div>

<script src="/auth-security.js?v=20260825-admin-bootstrap"></script>
<script src="js/login.js?v=20260828-session-token-1"></script>
</body>
</html>
