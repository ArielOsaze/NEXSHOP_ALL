<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login NexShop</title>
</head>
<body>

<main>
    <h1>Login NexShop</h1>

    <form id="loginForm">
        <label for="email">Email</label><br>
        <input type="email" id="email" required autocomplete="email"><br><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" required autocomplete="current-password"><br><br>

        <button type="submit" id="loginButton">Login</button>
    </form>

    <p id="loginStatus" role="status" aria-live="polite"></p>
</main>

<script src="public-login.js"></script>

</body>
</html>
