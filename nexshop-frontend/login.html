<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login NexShop</title>
    <link rel="stylesheet" href="/fonts/google-fonts.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous">
    <script src="theme-init.js?v=20260803-ui"></script>
    <script defer src="/clean-url.js?v=20260825"></script>
    <script defer src="/cookie-consent.js?v=20260825-no-float"></script>
    <link rel="stylesheet" href="style.css?v=20260903-responsive-nav-layout-4">
<link rel="stylesheet" href="/inline-styles.css?v=20260829-visual-regression-1">
<script defer src="/csp-legacy-handlers.js?v=20260829-visual-regression-1"></script>
</head>
<body class="public-login-page">

<main class="public-login-card" aria-labelledby="loginTitle">
    <a class="public-login-brand" href="/" aria-label="Kembali ke beranda NexShop">
        <img src="images/nexshop-logo.webp" alt="" width="44" height="44">
        <span>Nex<span>Shop</span></span>
    </a>
    <div class="public-login-copy">
        <p class="eyebrow">Akun NexShop</p>
        <h1 id="loginTitle">Selamat datang kembali</h1>
        <p>Masuk untuk melihat riwayat pesanan dan menyimpan checkout dengan lebih praktis.</p>
    </div>

    <form id="loginForm" class="public-login-form">
        <label for="email">Email
            <input type="email" id="email" required autocomplete="email" placeholder="kamu@email.com">
        </label>

        <label for="password">Password
            <input type="password" id="password" required autocomplete="current-password" placeholder="Masukkan password">
        </label>

        <p id="loginStatus" class="public-login-status" role="status" aria-live="polite"></p>
        <div class="auth-turnstile" id="publicLoginTurnstile" hidden></div>
        <p id="publicLoginTurnstileStatus" class="public-login-status is-error hidden" role="alert" aria-live="polite"></p>
        <button type="submit" id="loginButton" class="btn-primary">Login</button>
        <div class="auth-provider-divider" aria-hidden="true"><span>atau</span></div>
        <button type="button" id="googleLoginButton" class="auth-google-button">
            <i class="fa-brands fa-google" aria-hidden="true"></i> Lanjutkan dengan Google
        </button>
    </form>

        <p class="public-login-help">Belum punya akun? <a href="/#top">Daftar dari menu akun di beranda</a>.</p>
</main>

<script src="/auth-security.js?v=20260825"></script>
<script src="public-login.js?v=20260825-auth-security"></script>

</body>
</html>
